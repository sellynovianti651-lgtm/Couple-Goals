<!DOCTYPE html>
<html>
<head>
    <title>Couple Goals 💕</title>

    <!-- Font aesthetic -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(to right, #ffe6eb, #fff);
            text-align: center;
            margin: 0;
        }

        header {
            background: #ff4d6d;
            color: white;
            padding: 30px;
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
        }

        .container {
            padding: 20px;
        }

        .box {
            background: white;
            margin: 20px auto;
            padding: 20px;
            border-radius: 20px;
            width: 80%;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        input, select {
            padding: 10px;
            margin: 10px;
            border-radius: 10px;
            border: 1px solid #ccc;
            width: 80%;
        }

        button {
            background: #ff4d6d;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #ff3355;
        }

        #hasil {
            font-size: 18px;
            font-weight: bold;
            color: #ff4d6d;
        }
    </style>
</head>

<body>

<header>
    <h1>💖 Couple Goals 💖</h1>
    <p>Buat momen spesial jadi lebih berkesan 💕</p>
</header>

<div class="container">

<div class="box">
    <h2>💌 Data Kamu</h2>

    <input type="text" id="nama" placeholder="Nama kamu">
    <input type="text" id="pasangan" placeholder="Nama pasangan">

    <p>Jenis Kencan:</p>
    <select id="dateType">
        <option value="romantis">Romantis</option>
        <option value="simple">Simple</option>
        <option value="seru">Seru</option>
    </select>

    <p>Budget:</p>
    <select id="budget">
        <option value="low">Murah</option>
        <option value="medium">Sedang</option>
        <option value="high">Mahal</option>
    </select>

    <br><br>
    <button onclick="rekomendasi()">💡 Dapatkan Ide Spesial</button>
</div>

<div class="box">
    <h2>✨ Rekomendasi Untuk Kalian</h2>
    <p id="hasil">Isi data dulu ya 💕</p>
</div>

</div>

<script>
function rekomendasi() {
    let nama = document.getElementById("nama").value;
    let pasangan = document.getElementById("pasangan").value;
    let type = document.getElementById("dateType").value;
    let budget = document.getElementById("budget").value;

    let hasil = "";

    if (nama == "" || pasangan == "") {
        hasil = "Isi nama dulu ya 😆";
    } 
    else {
        if (type == "romantis" && budget == "low") {
            hasil = nama + " & " + pasangan + " cocok untuk dinner sederhana + surat cinta 💌";
        }
        else if (type == "romantis" && budget == "high") {
            hasil = nama + " & " + pasangan + " cocok untuk dinner mewah + bunga + hadiah spesial 🌹";
        }
        else if (type == "simple") {
            hasil = nama + " & " + pasangan + " cocok untuk nonton film + jajan favorit 🍿";
        }
        else if (type == "seru") {
            hasil = nama + " & " + pasangan + " cocok untuk jalan-jalan atau ke taman hiburan 🎢";
        }
        else {
            hasil = "Habiskan waktu berkualitas bersama ❤️";
        }
    }

    document.getElementById("hasil").innerText = hasil;
}
</script>

</body>
</html>
